# ============================================================
#  Application CashFlow - Configuration PostgreSQL
# ============================================================
spring.application.name=cashflow

# -- DataSource PostgreSQL --
spring.datasource.url=jdbc:postgresql://localhost:5432/cashflow_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Pas d'auto-ddl (pas de JPA) - on gère manuellement avec database.sql
# HikariCP pool (inclus par défaut avec spring-boot-starter-jdbc)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -- Serveur --
server.port=8080

# -- JSON : dates en ISO 8601 --
spring.jackson.serialization.write-dates-as-timestamps=false
